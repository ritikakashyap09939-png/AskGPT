<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Chat sidebar">
      <div class="sidebar-header">
        <a class="logo" href="#" aria-label="AskGPT home">
          <span class="logo-icon" aria-hidden="true">A</span>
          <span class="logo-text">AskGPT</span>
        </a>
        <button class="icon-btn sidebar-close" id="sidebar-close-btn" aria-label="Close sidebar">
          <span aria-hidden="true">&#10005;</span>
        </button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn" aria-label="Start a new chat">
        <span class="new-chat-icon" aria-hidden="true">+</span>
        <span>New chat</span>
      </button>

      <div class="sidebar-section">
        <h2 class="sidebar-heading">Recent</h2>
        <ul class="chat-list" id="chat-list"></ul>
      </div>

      <div class="sidebar-footer">
        <div class="user-box" id="user-box" hidden>
          <span class="user-email" id="user-email"></span>
          <button class="logout-btn" id="logout-btn" type="button">Log out</button>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">&#127769;</span>
          <span class="theme-toggle-label">Dark mode</span>
          <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open sidebar">
          <span class="menu-btn-bar" aria-hidden="true"></span>
          <span class="menu-btn-bar" aria-hidden="true"></span>
          <span class="menu-btn-bar" aria-hidden="true"></span>
        </button>
        <h1 class="topbar-title">AskGPT</h1>
      </header>

      <div class="main-toolbar" id="main-toolbar">
        <div class="export-wrap">
          <button class="export-btn" id="export-btn" aria-label="Export chat" hidden>
            <span class="export-btn-icon" aria-hidden="true">&#11015;</span>
            <span>Export chat</span>
          </button>
          <div class="export-menu" id="export-menu" hidden>
            <button class="export-menu-item" type="button" data-export="txt">Download as .txt</button>
            <button class="export-menu-item" type="button" data-export="pdf">Download as PDF</button>
          </div>
        </div>
      </div>

      <div class="chat-scroll" id="chat-scroll">
        <section class="welcome" id="welcome" aria-labelledby="welcome-title">
          <div class="welcome-logo" aria-hidden="true">A</div>
          <h2 class="welcome-title" id="welcome-title">Namaste! Main AskGPT hoon</h2>
          <p class="welcome-subtitle">Hindi, English ya Hinglish, jo bhi poochho</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion-card" type="button" data-suggestion="Explain something simply" aria-label="Explain something simply">
              Explain something simply
            </button>
            <button class="suggestion-card" type="button" data-suggestion="Help me write code" aria-label="Help me write code">
              Help me write code
            </button>
            <button class="suggestion-card" type="button" data-suggestion="Hindi mein ek kahani sunao" aria-label="Hindi mein ek kahani sunao">
              Hindi mein ek kahani sunao
            </button>
            <button class="suggestion-card" type="button" data-suggestion="Give me study tips" aria-label="Give me study tips">
              Give me study tips
            </button>
            <button class="suggestion-card" type="button" data-suggestion="Resume kaise banaye?" aria-label="Resume kaise banaye?">
              Resume kaise banaye?
            </button>
          </div>
        </section>

        <section class="messages" id="messages" aria-label="Chat messages" aria-live="polite" hidden></section>
      </div>

      <footer class="composer" id="composer">
        <div class="attachment-preview" id="attachment-preview" hidden>
          <img id="attachment-img" alt="Image preview" />
          <button class="attachment-remove" id="attachment-remove" type="button" aria-label="Remove image">×</button>
        </div>
        <div class="composer-inner">
          <button class="icon-btn attach-btn" id="attach-btn" type="button" aria-label="Attach image">
            <span class="attach-btn-icon" aria-hidden="true">&#128206;</span>
          </button>
          <input type="file" id="image-input" accept="image/*" hidden />

          <button class="icon-btn mic-btn" id="mic-btn" aria-label="Start voice input">
            <span class="mic-btn-icon" aria-hidden="true">&#127908;</span>
          </button>

          <button class="icon-btn voice-chat-btn" id="voice-chat-btn" type="button" aria-label="Start voice conversation">
            <span class="voice-chat-btn-icon" aria-hidden="true">&#128302;</span>
          </button>

          <button class="icon-btn image-btn" id="image-btn" type="button" aria-label="Create image" aria-pressed="false">
            <span class="image-btn-icon" aria-hidden="true">&#128247;</span>
          </button>

          <textarea
            id="user-input"
            class="user-input"
            rows="1"
            placeholder="Message AskGPT..."
            aria-label="Message"
          ></textarea>

          <button class="send-btn" id="send-btn" aria-label="Send message" disabled>
            <span class="send-btn-icon" aria-hidden="true">&#10148;</span>
          </button>
        </div>

        <div class="composer-meta">
          <div class="usage-display" id="usage-display" hidden></div>
          <label class="lang-field" for="lang-select">
            <span class="visually-hidden">Language</span>
            <select id="lang-select" class="lang-select" aria-label="Select language">
              <option value="hi-IN">Hindi hi-IN</option>
              <option value="en-IN">English en-IN</option>
            </select>
          </label>

          <button class="stop-speaking-btn" id="stop-speaking-btn" aria-label="Stop speaking" hidden>
            <span class="stop-btn-icon" aria-hidden="true">&#9632;</span>
            <span>Stop speaking</span>
          </button>
        </div>
      </footer>
    </main>
  </div>

<div class="auth-modal" id="auth-modal" hidden>
    <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <h2 class="auth-title" id="auth-title">Log in</h2>
      <p class="auth-subtitle">Apne account se login karo</p>
      <form class="auth-form" id="auth-form">
        <div class="oauth-block" id="oauth-block" hidden>
          <button class="oauth-btn" type="button" id="oauth-google" aria-label="Continue with Google" hidden>
            <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true" focusable="false">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
          <button class="oauth-btn" type="button" id="oauth-github" aria-label="Continue with GitHub" hidden>
            <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span>Continue with GitHub</span>
          </button>
          <div class="oauth-divider"><span>or</span></div>
        </div>
        <label class="auth-field">
          <span>Email</span>
          <input type="email" id="auth-email" autocomplete="email" required />
        </label>
        <label class="auth-field">
          <span>Password</span>
          <input type="password" id="auth-password" autocomplete="current-password" minlength="8" required />
        </label>
        <p class="auth-error" id="auth-error" hidden></p>
        <button class="auth-submit" type="submit" id="auth-submit">Log in</button>
      </form>
      <p class="auth-switch">
        <span id="auth-switch-label">Naya account?</span>
        <button class="auth-switch-btn" type="button" id="auth-switch-btn">Sign up</button>
      </p>
    </div>
  </div>

  <div class="voice-chat-overlay" id="voice-chat-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="voice-chat-title">
    <div class="voice-chat-panel">
      <header class="voice-chat-header">
        <h2 class="voice-chat-title" id="voice-chat-title">Voice Conversation</h2>
        <button class="icon-btn voice-chat-close" id="voice-chat-close" type="button" aria-label="End voice conversation">
          <span aria-hidden="true">&#10005;</span>
        </button>
      </header>
      <div class="voice-chat-content">
        <div class="voice-chat-circle-wrap">
          <div class="voice-chat-circle" id="voice-chat-circle">
            <span class="voice-chat-circle-inner" id="voice-chat-circle-inner"></span>
          </div>
          <div class="voice-chat-status" id="voice-chat-status" aria-live="polite">Sun rahi hoon...</div>
        </div>
        <div class="voice-chat-transcripts">
          <div class="voice-chat-transcript-section">
            <span class="voice-chat-transcript-label">You</span>
            <div class="voice-chat-user-transcript" id="voice-chat-user-transcript" aria-live="polite"></div>
          </div>
          <div class="voice-chat-transcript-section">
            <span class="voice-chat-transcript-label">AskGPT</span>
            <div class="voice-chat-bot-transcript" id="voice-chat-bot-transcript" aria-live="polite"></div>
          </div>
        </div>
      </div>
      <footer class="voice-chat-footer">
        <div class="voice-chat-controls">
          <button class="icon-btn voice-chat-mute" id="voice-chat-mute" type="button" aria-label="Pause listening" aria-pressed="false">
            <span class="voice-chat-mute-icon" aria-hidden="true">&#128263;</span>
          </button>
          <button class="voice-chat-end" id="voice-chat-end" type="button" aria-label="End voice conversation">
            <span class="voice-chat-end-icon" aria-hidden="true">&#9748;</span>
            <span>End</span>
          </button>
        </div>
        <div class="voice-chat-lang-field">
          <label class="visually-hidden" for="voice-chat-lang-select">Language</label>
          <select id="voice-chat-lang-select" class="voice-chat-lang-select" aria-label="Select language">
            <option value="hi-IN">Hindi hi-IN</option>
            <option value="en-IN">English en-IN</option>
          </select>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
